# Azure Kubernetes Service: images from the Azure Container Registry, the secrets of secrets.env, which
# deploy/azure/deploy.ps1 generates with random values and is never committed, and Caddy for HTTPS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cropconnect
resources:
  - ../../base
  - caddy.yaml
secretGenerator:
  - name: cropconnect-secrets
    envs:
      - secrets.env
images:
  - name: cropconnect/auth-service
    newName: cropconnect16641.azurecr.io/auth-service
  - name: cropconnect/users-service
    newName: cropconnect16641.azurecr.io/users-service
  - name: cropconnect/farms-service
    newName: cropconnect16641.azurecr.io/farms-service
  - name: cropconnect/orders-service
    newName: cropconnect16641.azurecr.io/orders-service
  - name: cropconnect/sensors-service
    newName: cropconnect16641.azurecr.io/sensors-service
  - name: cropconnect/notifications-service
    newName: cropconnect16641.azurecr.io/notifications-service
  - name: cropconnect/api-gateway
    newName: cropconnect16641.azurecr.io/api-gateway
  - name: cropconnect/sensor-simulator
    newName: cropconnect16641.azurecr.io/sensor-simulator
  - name: cropconnect/web
    newName: cropconnect16641.azurecr.io/web
patches:
  # Real email delivery through Brevo's SMTP relay; the login, key and sender come from secrets.env.
  - target: { kind: ConfigMap, name: cropconnect-config }
    patch: |
      - op: add
        path: /data/Email__Provider
        value: Smtp
      - op: add
        path: /data/Email__Smtp__Host
        value: smtp-relay.brevo.com
      - op: add
        path: /data/Email__Smtp__Port
        value: "587"
      - op: add
        path: /data/Email__AppBaseUrl
        value: https://cropconnect.belgiumcentral.cloudapp.azure.com/
      - op: add
        path: /data/Email__SkipReservedDomains
        value: "true"
  # Caddy is the public entry point (HTTPS), so the web app stays inside the cluster.
  - target: { kind: Service, name: web }
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP
  # Every deploy pushes new "latest" images, so the nodes must check the registry on each pod start.
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
