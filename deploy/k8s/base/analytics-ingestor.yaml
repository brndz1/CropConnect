# Copies every reading and domain event, and a daily snapshot of the catalog, to MongoDB for the analytics.
# Nothing calls it, so it has no Service; one replica, since the reading duplicates are checked by a lookup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-ingestor
  template:
    metadata:
      labels:
        app: analytics-ingestor
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-infrastructure
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z mongodb 27017 && nc -z rabbitmq 5672; do echo waiting; sleep 2; done"]
          securityContext:
            runAsUser: 1000
      containers:
        - name: analytics-ingestor
          image: cropconnect/analytics-ingestor
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cropconnect-config
          env:
            - name: OTEL_SERVICE_NAME
              value: analytics-ingestor
            - name: MONGO_USER
              valueFrom:
                secretKeyRef: { name: cropconnect-secrets, key: MONGO_USER }
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: { name: cropconnect-secrets, key: MONGO_PASSWORD }
            - name: ConnectionStrings__AnalyticsDb
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/?authSource=admin
            - name: Pseudonymization__Key
              valueFrom:
                secretKeyRef: { name: cropconnect-secrets, key: PSEUDONYMIZATION_KEY }
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef: { name: cropconnect-secrets, key: RABBITMQ_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: cropconnect-secrets, key: RABBITMQ_PASSWORD }
            - name: CatalogSnapshots__FarmsServiceUrl
              value: http://farms-service.cropconnect.svc.cluster.local:8080
          # No gRPC server here, so the probes are plain HTTP.
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /alive, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 30m, memory: 128Mi }
            limits: { cpu: 300m, memory: 300Mi }
