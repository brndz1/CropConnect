# Settings shared by the services. Secrets (passwords, JWT key, API key) are in the cropconnect-secrets Secret,
# generated by the overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cropconnect-config
data:
  JwtSettings__Issuer: CropConnect.Auth
  JwtSettings__Audience: CropConnect.Clients
  Database__ApplyMigrationsOnStartup: "true"
  # Spread the gRPC calls over every replica of a service (headless Services, see CropConnect.ServiceDefaults).
  # Its DNS resolver (used by every HttpClient) does not use the search domains, so the HTTP and gRPC addresses
  # below are fully qualified.
  ServiceDiscovery__UseDns: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  FarmsService__Url: http://farms-service.cropconnect.svc.cluster.local:8080
  AuthService__Url: http://auth-service.cropconnect.svc.cluster.local:8080
  Downstream__Auth: http://auth-service.cropconnect.svc.cluster.local:8080
  Downstream__Users: http://users-service.cropconnect.svc.cluster.local:8080
  Downstream__Farms: http://farms-service.cropconnect.svc.cluster.local:8080
  Downstream__Orders: http://orders-service.cropconnect.svc.cluster.local:8080
  Downstream__Sensors: http://sensors-service.cropconnect.svc.cluster.local:8080
  Downstream__Notifications: http://notifications-service.cropconnect.svc.cluster.local:8080
  Email__Provider: Mailpit
  Email__FromAddress: notifications@cropconnect.test
  Email__Mailpit__BaseUrl: http://mailpit.cropconnect.svc.cluster.local:8025/
  # The resolver logs a warning for every missing IPv6 (AAAA) record on each refresh.
  Logging__LogLevel__Microsoft.Extensions.ServiceDiscovery.Dns.Resolver: Error
