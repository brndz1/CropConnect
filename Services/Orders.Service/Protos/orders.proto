syntax = "proto3";

option csharp_namespace = "Orders.Service.Protos";

package orders.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service OrdersService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderInfo);
  rpc GetOrder (GetOrderRequest) returns (OrderInfo);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc ListMyOrders (ListMyOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (OrderInfo);
  rpc CancelOrder (CancelOrderRequest) returns (OrderInfo);
}

service ReviewsService {
  rpc CreateReview (CreateReviewRequest) returns (ReviewInfo);
  rpc GetReviewByOrder (GetReviewByOrderRequest) returns (ReviewInfo);
  rpc ListFarmReviews (ListFarmReviewsRequest) returns (ListFarmReviewsResponse);
}

enum OrderStatusProto {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_READY_FOR_PICKUP = 3;
  ORDER_STATUS_PICKED_UP = 4;
  ORDER_STATUS_CANCELLED = 5;
}

message DecimalValue {
  int64 units = 1;
  sfixed32 nanos = 2;
}

message OrderItemInfo {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  DecimalValue unit_price = 4;
  DecimalValue total_price = 5;
}

message OrderInfo {
  string id = 1;
  string customer_id = 2;
  string farm_id = 3;
  OrderStatusProto status = 4;
  DecimalValue total_amount = 5;
  repeated OrderItemInfo items = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int32 version = 9;
  optional string cancellation_reason = 10;
  optional string notes = 11;
}

message OrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  repeated OrderItemInput items = 1;
  optional string notes = 2;
}

message GetOrderRequest {
  string id = 1;
}

message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional string farm_id = 3;
  optional OrderStatusProto status = 4;
}

message ListMyOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional OrderStatusProto status = 3;
}

message ListOrdersResponse {
  repeated OrderInfo orders = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateOrderStatusRequest {
  string id = 1;
  OrderStatusProto new_status = 2;
  optional int32 expected_version = 3;
}

message CancelOrderRequest {
  string id = 1;
  optional string reason = 2;
  optional int32 expected_version = 3;
}

message ReviewInfo {
  string id = 1;
  string order_id = 2;
  string customer_id = 3;
  string farm_id = 4;
  int32 rating = 5;
  string comment = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateReviewRequest {
  string order_id = 1;
  int32 rating = 2;
  string comment = 3;
}

message GetReviewByOrderRequest {
  string order_id = 1;
}

message ListFarmReviewsRequest {
  string farm_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListFarmReviewsResponse {
  repeated ReviewInfo reviews = 1;
  int32 total_count = 2;
}
