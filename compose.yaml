# Local environment with every service, PostgreSQL and RabbitMQ:
#   docker compose up -d --build
# The defaults are for development only; override them in a .env file (see .env.example).
# Only the API gateway is reachable from other machines; the services and the infrastructure are published on
# 127.0.0.1 for local debugging and the tests (section 5.1: the services are not exposed to the outside).

name: cropconnect

x-service: &service
  restart: unless-stopped
  networks: [cropconnect]

x-jwt: &jwt
  JwtSettings__Secret: ${JWT_SECRET:-SuperSecretKeyForDevelopmentOnly12345!}
  JwtSettings__Issuer: CropConnect.Auth
  JwtSettings__Audience: CropConnect.Clients

x-database: &database
  Database__ApplyMigrationsOnStartup: "true"

# Logs, traces and metrics of every service go to the Aspire dashboard (http://localhost:18888).
x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [cropconnect]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    networks: [cropconnect]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Auth.Service/Dockerfile
    image: cropconnect/auth-service
    ports:
      - "127.0.0.1:5298:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: auth-service
      ConnectionStrings__AuthDb: Host=postgres;Database=auth_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      JwtSettings__ExpirationMinutes: "60"
      InternalApi__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      BootstrapAdmin__Username: ${ADMIN_USERNAME:-admin}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:-admin@cropconnect.test}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:-DevAdmin-ChangeMe-123}
    depends_on:
      postgres:
        condition: service_healthy

  users-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Users.Service/Dockerfile
    image: cropconnect/users-service
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: users-service
      ConnectionStrings__UsersDb: Host=postgres;Database=users_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  farms-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Farms.Service/Dockerfile
    image: cropconnect/farms-service
    ports:
      - "127.0.0.1:5002:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: farms-service
      ConnectionStrings__FarmsDb: Host=postgres;Database=farms_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      InternalApi__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Orders.Service/Dockerfile
    image: cropconnect/orders-service
    ports:
      - "127.0.0.1:5003:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: orders-service
      ConnectionStrings__OrdersDb: Host=postgres;Database=orders_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      InternalApi__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      FarmsService__Url: http://farms-service:8080
      FarmsService__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      farms-service:
        condition: service_healthy

  sensors-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Sensors.Service/Dockerfile
    image: cropconnect/sensors-service
    ports:
      - "127.0.0.1:5004:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: sensors-service
      ConnectionStrings__SensorsDb: Host=postgres;Database=sensors_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      InternalApi__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      FarmsService__Url: http://farms-service:8080
      FarmsService__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      farms-service:
        condition: service_healthy

  notifications-service:
    <<: *service
    build:
      context: .
      dockerfile: Services/Notifications.Service/Dockerfile
    image: cropconnect/notifications-service
    ports:
      - "127.0.0.1:5005:8080"
    environment:
      <<: [*jwt, *database, *telemetry]
      OTEL_SERVICE_NAME: notifications-service
      ConnectionStrings__NotificationsDb: Host=postgres;Database=notifications_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      FarmsService__Url: http://farms-service:8080
      FarmsService__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      AuthService__Url: http://auth-service:8080
      AuthService__ApiKey: ${INTERNAL_API_KEY:-dev-internal-api-key-change-me-0123456789}
      # Mailpit by default; set EMAIL_PROVIDER=Mailtrap and MAILTRAP_API_TOKEN to send through Mailtrap.
      Email__Provider: ${EMAIL_PROVIDER:-Mailpit}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-notifications@cropconnect.test}
      Email__Mailpit__BaseUrl: http://mailpit:8025/
      Email__Mailtrap__ApiToken: ${MAILTRAP_API_TOKEN:-}
      Email__Mailtrap__SandboxInboxId: ${MAILTRAP_SANDBOX_INBOX_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      farms-service:
        condition: service_healthy
      mailpit:
        condition: service_started

  # The only REST entry point for clients; it translates each call to gRPC on the services above.
  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: CropConnect.ApiGateway/Dockerfile
    image: cropconnect/api-gateway
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    environment:
      <<: [*jwt, *telemetry]
      OTEL_SERVICE_NAME: api-gateway
      Downstream__Auth: http://auth-service:8080
      Downstream__Users: http://users-service:8080
      Downstream__Farms: http://farms-service:8080
      Downstream__Orders: http://orders-service:8080
      Downstream__Sensors: http://sensors-service:8080
      Downstream__Notifications: http://notifications-service:8080
    depends_on:
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      farms-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      sensors-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy

  # The web app (http://localhost:3000); nginx serves it and forwards /api to the gateway.
  web:
    <<: *service
    build: web
    image: cropconnect/web
    ports:
      - "${WEB_PORT:-3000}:8080"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy

  # Catches every email locally; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [cropconnect]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Aspire dashboard on its own: the logs, distributed traces and metrics the services export over OTLP.
  # It has no login, so it is only published on 127.0.0.1.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    restart: unless-stopped
    networks: [cropconnect]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-18888}:18888"

  # Simulated farm sensors (RF16), only with --profile simulation so the tests never see random alerts.
  # Every 30 s it sends a reading per active farm and sensor type; open http://localhost:1881 for the flow.
  sensor-simulator:
    profiles: [simulation]
    build: Simulation/node-red
    image: cropconnect/sensor-simulator
    restart: unless-stopped
    networks: [cropconnect]
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-1881}:1880"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

networks:
  cropconnect:

volumes:
  postgres-data:
  rabbitmq-data:
